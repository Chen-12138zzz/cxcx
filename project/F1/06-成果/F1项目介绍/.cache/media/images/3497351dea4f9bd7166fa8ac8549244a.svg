<svg width="434" height="420" viewBox="0 0 434 420" xmlns="http://www.w3.org/2000/svg"><line x1="26" y1="26" x2="26" y2="394" stroke="#D6DCE5" stroke-width="2" /><circle cx="26" cy="26" r="10" fill="#1E4FA8" /><text x="50" y="24" font-size="16" fill="#1A2230" font-weight="bold">角色审计</text><text x="50" y="43" font-size="13" fill="#8B97A8">谁是混杂 / 中介 / 碰撞</text><circle cx="26" cy="79" r="10" fill="#3D7BD9" /><text x="50" y="77" font-size="16" fill="#1A2230" font-weight="bold">正性诊断</text><text x="50" y="96" font-size="13" fill="#8B97A8">有没有共同支撑</text><circle cx="26" cy="132" r="10" fill="#3D7BD9" /><text x="50" y="130" font-size="16" fill="#1A2230" font-weight="bold">效应估计</text><text x="50" y="149" font-size="13" fill="#8B97A8">双重稳健 + 交叉拟合</text><circle cx="26" cy="185" r="10" fill="#3D7BD9" /><text x="50" y="183" font-size="16" fill="#1A2230" font-weight="bold">剂量-反应曲线</text><text x="50" y="202" font-size="13" fill="#8B97A8">效应随干预档位怎么变</text><circle cx="26" cy="238" r="10" fill="#3D7BD9" /><text x="50" y="236" font-size="16" fill="#1A2230" font-weight="bold">敏感性分析</text><text x="50" y="255" font-size="13" fill="#8B97A8">多强的混杂才能推翻结论</text><circle cx="26" cy="291" r="13" fill="#0E3F8C" /><text x="50" y="289" font-size="16" fill="#0E3F8C" font-weight="bold">识别假设台账</text><text x="50" y="308" font-size="13" fill="#8B97A8">逐条标注核验状态</text><circle cx="26" cy="344" r="13" fill="#0E3F8C" /><text x="50" y="342" font-size="16" fill="#0E3F8C" font-weight="bold">报告守卫</text><text x="50" y="361" font-size="13" fill="#8B97A8">不合格输出直接拦截</text><rect x="0" y="392" width="434" height="28" fill="#E8EFF8" rx="4" /><text x="217" y="411" font-size="14" fill="#1E4FA8" text-anchor="middle" font-weight="bold">效应值 + 它的有效边界</text></svg>