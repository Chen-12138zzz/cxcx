<svg width="440" height="208" viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg"><text x="0" y="16" font-size="14" fill="#1E4FA8" font-weight="bold">中介 M（须调整吗？不）</text><circle cx="40" cy="60" r="20" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><text x="40" y="66" font-size="15" fill="#1A2230" text-anchor="middle">T</text><circle cx="200" cy="60" r="20" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><text x="200" y="66" font-size="15" fill="#1A2230" text-anchor="middle">M</text><circle cx="360" cy="60" r="20" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><text x="360" y="66" font-size="15" fill="#1A2230" text-anchor="middle">Y</text><line x1="60" y1="60" x2="180" y2="60" stroke="#3D7BD9" stroke-width="2" /><line x1="220" y1="60" x2="340" y2="60" stroke="#3D7BD9" stroke-width="2" /><line x1="48" y1="78" x2="352" y2="78" stroke="#D9534F" stroke-width="2" stroke-dasharray="6 4" /><text x="200" y="96" font-size="13" fill="#D9534F" text-anchor="middle">T → Y 总效应（含经 M 的通路）</text><text x="0" y="140" font-size="14" fill="#1E4FA8" font-weight="bold">碰撞 C（须调整吗？绝不）</text><circle cx="40" cy="184" r="20" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><text x="40" y="190" font-size="15" fill="#1A2230" text-anchor="middle">T</text><circle cx="200" cy="184" r="20" fill="#FBE9E8" stroke="#D9534F" stroke-width="2" /><text x="200" y="190" font-size="15" fill="#1A2230" text-anchor="middle">C</text><circle cx="360" cy="184" r="20" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><text x="360" y="190" font-size="15" fill="#1A2230" text-anchor="middle">Y</text><line x1="58" y1="178" x2="182" y2="178" stroke="#D9534F" stroke-width="2" /><polygon points="182,178 172,173 172,183" fill="#D9534F" /><line x1="218" y1="178" x2="342" y2="178" stroke="#D9534F" stroke-width="2" /><polygon points="218,178 228,173 228,183" fill="#D9534F" /><text x="200" y="226" font-size="13" fill="#D9534F" text-anchor="middle">调整 C 会「造出」一条本不存在的 T–Y 关联</text></svg>