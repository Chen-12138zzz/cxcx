<svg width="688" height="160" viewBox="0 0 688 160" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="212" height="62" rx="4" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="106" y="32" font-size="14" fill="#1A2230" text-anchor="middle" font-weight="bold">安全合规层</text><text x="106" y="52" font-size="12" fill="#8B97A8" text-anchor="middle">拦有害内容 · 查合规风险</text><rect x="238" y="8" width="212" height="62" rx="4" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="344" y="32" font-size="14" fill="#1A2230" text-anchor="middle" font-weight="bold">通用可信层</text><text x="344" y="52" font-size="12" fill="#8B97A8" text-anchor="middle">问答对 · 特征分布 · 漂移</text><rect x="476" y="4" width="212" height="70" rx="4" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><text x="582" y="30" font-size="14" fill="#0E3F8C" text-anchor="middle" font-weight="bold">事实与问责层</text><text x="582" y="50" font-size="12" fill="#1E4FA8" text-anchor="middle">逐数字回溯 · 出错定位到环节</text><text x="582" y="66" font-size="12" fill="#D9534F" text-anchor="middle">← 本项目</text><line x1="218" y1="39" x2="232" y2="39" stroke="#D6DCE5" stroke-width="2" /><line x1="456" y1="39" x2="470" y2="39" stroke="#D6DCE5" stroke-width="2" /><rect x="0" y="92" width="688" height="60" rx="4" fill="#0E3F8C" /><text x="16" y="116" font-size="14" fill="#FFC107" font-weight="bold">关键区别：</text><text x="100" y="116" font-size="14" fill="#FFFFFF">我们的理由不是「他们没想到」。</text><text x="16" y="138" font-size="14" fill="#BFD5EF">大厂不缺想到这件事的人，缺的是「为湛江的散户预警文本做问责」这个具体动机。</text></svg>