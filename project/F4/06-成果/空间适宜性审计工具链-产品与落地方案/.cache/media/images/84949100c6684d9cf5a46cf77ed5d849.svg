<svg width="442" height="196" viewBox="0 0 442 196" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="4" width="442" height="42" rx="4" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="14" y="22" font-size="13" fill="#8B97A8">输入</text><text x="14" y="39" font-size="14" fill="#1A2230">一套 GIS-MCE 适宜性评估流程（栅格 + 权重 + 重分类）</text><line x1="221" y1="50" x2="221" y2="70" stroke="#3D7BD9" stroke-width="2" /><polygon points="221,72 216,62 226,62" fill="#3D7BD9" /><rect x="0" y="76" width="442" height="42" rx="4" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="1" /><text x="14" y="94" font-size="13" fill="#1E4FA8">逐项拆开，单项扰动</text><text x="14" y="111" font-size="14" fill="#1A2230">尺度 · 权重 · 重分类 · 分辨率</text><line x1="221" y1="122" x2="221" y2="142" stroke="#3D7BD9" stroke-width="2" /><polygon points="221,144 216,134 226,134" fill="#3D7BD9" /><rect x="0" y="148" width="442" height="42" rx="4" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="14" y="166" font-size="13" fill="#8B97A8">输出</text><text x="14" y="183" font-size="14" fill="#1A2230">每一项选择各自带来多大后果（带样本量）</text></svg>