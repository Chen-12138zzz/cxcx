<svg width="442" height="216" viewBox="0 0 442 216" xmlns="http://www.w3.org/2000/svg"><text x="0" y="16" font-size="14" fill="#8B97A8">海湾级决策单元：一个栅格 ≫ 决策对象</text><rect x="0" y="26" width="442" height="26" rx="3" fill="#D6DCE5" /><line x1="221" y1="26" x2="221" y2="52" stroke="#FFFFFF" stroke-width="2" /><text x="228" y="44" font-size="13" fill="#4A5568">1 km 栅格</text><rect x="0" y="26" width="22" height="26" rx="3" fill="#8B97A8" /><text x="0" y="86" font-size="14" fill="#8B97A8">高位池决策单元：栅格远大于决策对象</text><rect x="0" y="96" width="22" height="26" rx="3" fill="#1E4FA8" /><text x="32" y="114" font-size="13" fill="#1E4FA8" font-weight="bold">50 m 单池</text><text x="126" y="114" font-size="13" fill="#8B97A8">← 决策真正作用的对象</text><rect x="0" y="136" width="442" height="26" rx="3" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="10" y="154" font-size="13" fill="#4A5568">同一张 1 km 栅格：对前者合适，对后者每格约覆盖 278 口池</text><rect x="0" y="176" width="442" height="34" rx="3" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="1" /><text x="12" y="198" font-size="14" fill="#1E4FA8" font-weight="bold">100 m 网格：每格约 2.78 口池　｜　200 m：约 11.11 口</text></svg>