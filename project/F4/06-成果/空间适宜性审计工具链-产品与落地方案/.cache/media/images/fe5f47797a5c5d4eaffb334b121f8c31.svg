<svg width="700" height="124" viewBox="0 0 700 124" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="218" height="58" rx="4" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="109" y="25" font-size="15" fill="#1E4FA8" text-anchor="middle" font-weight="bold">尺度失配诊断</text><text x="109" y="45" font-size="12" fill="#8B97A8" text-anchor="middle">网格粗于池体，代价多大</text><rect x="241" y="0" width="218" height="58" rx="4" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="350" y="25" font-size="15" fill="#1E4FA8" text-anchor="middle" font-weight="bold">融合账本与误差分解</text><text x="350" y="45" font-size="12" fill="#8B97A8" text-anchor="middle">增益与代价，分开报</text><rect x="482" y="0" width="218" height="58" rx="4" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" /><text x="591" y="25" font-size="15" fill="#1E4FA8" text-anchor="middle" font-weight="bold">缺失到后果</text><text x="591" y="45" font-size="12" fill="#8B97A8" text-anchor="middle">少报一项，代价几个位</text><line x1="109" y1="60" x2="109" y2="80" stroke="#3D7BD9" stroke-width="2" /><line x1="350" y1="60" x2="350" y2="80" stroke="#3D7BD9" stroke-width="2" /><line x1="591" y1="60" x2="591" y2="80" stroke="#3D7BD9" stroke-width="2" /><line x1="109" y1="80" x2="591" y2="80" stroke="#3D7BD9" stroke-width="2" /><rect x="150" y="92" width="400" height="32" rx="4" fill="#E8EFF8" stroke="#1E4FA8" stroke-width="2" /><line x1="350" y1="80" x2="350" y2="92" stroke="#3D7BD9" stroke-width="2" /><polygon points="350,92 345,82 355,82" fill="#3D7BD9" /><text x="350" y="113" font-size="15" fill="#0E3F8C" text-anchor="middle" font-weight="bold">每条结论都带口径与适用范围</text></svg>